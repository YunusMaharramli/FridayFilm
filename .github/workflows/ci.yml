name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore
        run: dotnet restore FridayFilm/FridayFilm.slnx
      - name: Build
        run: dotnet build FridayFilm/FridayFilm.slnx --no-restore -c Release
      - name: Test (.NET)
        run: dotnet test FridayFilm/FridayFilm.slnx --no-build -c Release
      - name: Test (frontend)
        run: node --test FridayFilm/Tests/frontend.test.cjs
